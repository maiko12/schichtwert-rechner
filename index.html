<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schichtwert-Rechner</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="card">
    <p class="eyebrow">TESTPROJEKT · VERSION 1.0</p>
    <h1>Schichtwert-Rechner</h1>
    <p>Berechne gewichtete Stunden für eine Schicht. Die Faktoren dienen nur als Beispiel.</p>
    <form id="calculator">
      <label>Beginn <input id="start" type="time" value="13:00" required></label>
      <label>Ende <input id="end" type="time" value="01:00" required></label>
      <label>Belastungsfaktor <input id="factor" type="number" min="0.1" max="5" step="0.05" value="1.25" required></label>
      <button type="submit">Berechnen</button>
    </form>
    <section class="result" aria-live="polite">
      <p id="duration">Dauer: –</p>
      <strong id="weighted">Gewichtete Stunden: –</strong>
    </section>
    <p class="note">Eine Endzeit vor oder gleich der Startzeit wird als Folgetag interpretiert.</p>
  </main>
</body>
</html>
